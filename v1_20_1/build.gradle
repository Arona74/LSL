plugins {
    // Obfuscated Minecraft: the remapping Loom plugin with Mojang mappings.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// The shared config screen relies on Screen drawing its own background and on 1.20.2's mouse-wheel
// signature; this module's own src/ supplies the 1.20.1 copy.
ext.fabricOverridden = ['io/arona74/lsl/client/config/LslConfigScreen.java']

apply from: rootProject.file('gradle/lsl-module.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
