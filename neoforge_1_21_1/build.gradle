// NeoForge 1.21.1 (ModDevGradle; Minecraft runs with Mojang names, so nothing is remapped).
//
// Sources:
//   src/main/java                      loader-agnostic code (shared with the Fabric modules)
//   neoforge/src/main/{java,resources} NeoForge loader layer (entrypoint, config, DH mixin plugin)
//   fabric/src/main/java               only the config screen classes, which use no Fabric API
//   v1_21_1/src/main/java              Minecraft 1.21.1 screen seams (option list, preview panel)
//   fabric/src/main/resources          only assets/ (lang); the mixin config is NeoForge's own
//   voxy/src/main/java                 the shared Voxy hooks, staged with 26.x class names mapped to 1.21.1's
//   neoforge_1_21_1/src/main/java      Compat (with the Voxy hooks), ScreenCompat, the Voxy seams for 1.21.1 and
//                                      Roxy (voxy/Platform, VoxyMc, CtmBake, SodiumCtmContext, two bakery/shader mixins)
//                                      and lsl.voxy.mixins.json
plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = rootProject.mod_version + "+mc${project.minecraft_version}-neoforge"
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version
    mods {
        lsl {
            sourceSet sourceSets.main
        }
    }
}

def stageShared = tasks.register('stageSharedJava', Sync) {
    from(rootProject.file('fabric/src/main/java')) {
        include 'io/arona74/lsl/client/config/ConfigPreview.java'
        include 'io/arona74/lsl/client/config/ConfigWidgets.java'
        include 'io/arona74/lsl/client/config/LslConfigScreen.java'
    }
    from(rootProject.file('v1_21_1/src/main/java')) {
        include 'io/arona74/lsl/client/config/OptionRows.java'
        include 'io/arona74/lsl/client/config/PreviewPanel.java'
    }
    into layout.buildDirectory.dir('sharedJava')
}

// The shared Voxy hooks are written against Minecraft 26.x. Classes that only moved package are
// mapped here, on import lines only; anything that changed shape goes through voxy/VoxyMc.
def voxyImports = [
    'net.minecraft.client.resources.model.geometry.BakedQuad': 'net.minecraft.client.renderer.block.model.BakedQuad',
]
def stageVoxy = tasks.register('stageVoxyJava', Sync) {
    from(rootProject.file('voxy/src/main/java'))
    inputs.property('voxyImports', voxyImports)
    filter { String line ->
        if (!line.startsWith('import ')) return line
        voxyImports.each { moved, now -> line = line.replace("import ${moved};", "import ${now};") }
        return line
    }
    into layout.buildDirectory.dir('voxyJava')
}

def stageSharedResources = tasks.register('stageSharedResources', Sync) {
    from(rootProject.file('fabric/src/main/resources')) {
        include 'assets/**'
    }
    into layout.buildDirectory.dir('sharedResources')
}

sourceSets {
    main {
        java {
            srcDirs += rootProject.file('src/main/java')
            srcDirs += rootProject.file('neoforge/src/main/java')
            srcDir(stageShared)
            srcDir(stageVoxy)
        }
        resources {
            srcDirs += rootProject.file('neoforge/src/main/resources')
            srcDir(stageSharedResources)
        }
    }
}

dependencies {
    // Distant Horizons api + core classes (extracted from the DH 3.3.3 jar; no Minecraft classes).
    compileOnly files(rootProject.file('libs/distanthorizons-3.3.3-compile.jar'))
    // Voxy as Roxy patches it for NeoForge 1.21.1 (Mojang names, Roxy's bridges): made offline by
    // running Roxy's own patcher on the Voxy jar (see README). Voxy may not be redistributed, so
    // the jar is git-ignored and compile-only.
    compileOnly files(rootProject.file("libs/voxy-${project.voxy_version}-roxy-${project.minecraft_version}.jar"))
    // Fabric's renderer API as Forgified Fabric API ships it for 1.21.1 (Apache 2.0, taken from the
    // FFAPI jar Roxy requires): CtmBake asks Continuity models to draw themselves through it.
    compileOnly files(rootProject.file('libs/ffapi-fabric-renderer-api-v1-3.4.1+9125b6dc19.jar'),
        rootProject.file('libs/ffapi-fabric-api-base-0.4.42+d1308ded19.jar'))
    // Sodium 0.8.13 for NeoForge (Polyform Shield; git-ignored, compile-only): with Sodium as the
    // renderer, CtmBake's capture must be one of Sodium's own block render contexts.
    compileOnly files(rootProject.file('libs/sodium-neoforge-0.8.13+mc1.21.1-mod.jar'))
}

processResources {
    def props = [
        'version'        : project.version,
        'neoforge_range' : project.neoforge_range,
        'minecraft_range': project.minecraft_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
